<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>မုန့်ဖိုးတောင်းလွှာ Web App</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff0055;
      --primary-hover: #ff3377;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --bg-glass: rgba(10, 12, 28, 0.96);
      --radius-custom: 26px;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Padauk', 'Poppins', sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #131238, #05030f);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: var(--text-color);
    }

    /* Intro Splash Screen */
    #introSplash {
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .intro-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 12, 28, 0.95);
      padding: 12px 20px;
      border-radius: 18px;
      border: 1.5px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    #introSplash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ocean Waves Background */
    .ocean {
      height: 160px;
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .wave {
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,65 C650,170 900,10 1200,40 L1200,120 L0,120 Z" fill="rgba(0, 242, 254, 0.15)"/></svg>');
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
      animation: waveMove 10s linear infinite;
    }

    .wave:nth-of-type(2) {
      bottom: -10px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,65 C650,170 900,10 1200,40 L1200,120 L0,120 Z" fill="rgba(255, 0, 85, 0.15)"/></svg>');
      animation: waveMove 6s linear infinite, waveSwell 4s ease-in-out infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes waveSwell {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Top Language Switcher */
    .top-lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .top-lang-switcher select {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.6);
      background: rgba(10, 12, 28, 0.95);
      color: #fff;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Step Loader */
    #stepLoader {
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    #stepLoader.show {
      opacity: 1;
      visibility: visible;
    }

    .blue-white-spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00f2fe;
      border-right-color: #ffffff;
      animation: spin 0.7s linear infinite;
      box-shadow: 0 0 10px var(--accent-glow);
      flex-shrink: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Main App Container */
    .app-card {
      width: 90%;
      max-width: 410px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-custom);
      border: 2px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(255, 0, 85, 0.15);
      padding: 22px;
      position: relative;
      z-index: 10;
      animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .step {
      display: none;
      opacity: 0;
      transform: translateY(15px);
    }

    .step.active {
      display: block;
      animation: stepFadeSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stepFadeSlideIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      color: var(--accent);
      text-align: center;
      font-size: 20px;
      margin-bottom: 14px;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-glow);
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 14px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #ffffff;
      font-size: 13px;
      text-shadow: 0 0 6px rgba(0, 242, 254, 0.3);
    }

    /* Custom Select Component */
    .custom-select-wrapper {
      position: relative;
      width: 100%;
      user-select: none;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .custom-select-trigger:hover, .custom-select-wrapper.open .custom-select-trigger {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(255, 255, 255, 0.1);
    }

    .custom-select-trigger svg {
      width: 16px;
      height: 16px;
      fill: var(--accent);
      transition: transform 0.4s ease;
    }

    .custom-select-wrapper.open .custom-select-trigger svg {
      transform: rotate(180deg);
    }

    .custom-options {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
      opacity: 0;
      background: #0e1124;
      border: 1.5px solid transparent;
      border-radius: 12px;
      margin-top: 0;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      z-index: 99;
    }

    .custom-select-wrapper.open .custom-options {
      max-height: 250px;
      overflow-y: auto;
      opacity: 1;
      border-color: rgba(0, 242, 254, 0.6);
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 10px var(--accent-glow);
    }

    .custom-option {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover {
      background: rgba(0, 242, 254, 0.15);
      padding-left: 18px;
      color: var(--accent);
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.35);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(255, 255, 255, 0.1);
    }

    select option {
      background: #1e272e;
      color: #ffffff;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: block;
      width: 100%;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .profile-action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .profile-small-btn, .file-btn {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .profile-small-btn:hover, .file-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 242, 254, 0.12);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #ff3377);
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 0, 85, 0.4);
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 0, 85, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      box-shadow: none;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Profile Section */
    .profile-container {
      text-align: center;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    .profile-avatar-box {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 10px;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .profile-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffeaa7;
      margin-bottom: 2px;
      text-shadow: 0 0 6px rgba(255,234,167,0.4);
    }

    .profile-id {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 14px;
    }

    .dashboard-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 🌟 History List Styles (မျဉ်း 3 ကြောင်း Menu နှင့် Dropdown စတိုင်များ) */
    .history-list-container {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      padding-right: 4px;
    }

    .history-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 8px;
      position: relative;
    }

    .history-link-text {
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: left;
      font-weight: 600;
    }

    .history-menu-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .history-menu-btn:hover {
      background: rgba(0, 242, 254, 0.2);
    }

    .history-dropdown-menu {
      display: none;
      position: absolute;
      right: 12px;
      top: 42px;
      background: #111326;
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 100;
      min-width: 110px;
      overflow: hidden;
    }

    .history-dropdown-menu.show {
      display: block;
    }

    .history-dropdown-item {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      transition: background 0.2s, color 0.2s;
    }

    .history-dropdown-item:last-child {
      border-bottom: none;
      color: #ff4757;
    }

    .history-dropdown-item:hover {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
    }
    .history-dropdown-item:last-child:hover {
      color: #ff6b81;
      background: rgba(255, 71, 87, 0.15);
    }

    /* Export Card Preview (4:3 Card) */
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.4deg); }
    }

    #exportCard {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 3 / 4;
      margin: 0 auto 12px auto;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow), 0 10px 24px rgba(0, 0, 0, 0.8);
      background: #0f1123;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      animation: cardFloat 4s ease-in-out infinite, cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card-full-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(1.06) contrast(1.06) saturate(1.05);
      z-index: 1;
      display: none;
    }

    .sender-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      background: var(--primary);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(255, 71, 87, 0.5);
      z-index: 5;
    }

    .card-header-content {
      position: relative;
      z-index: 2;
      margin: auto;
      padding: 12px;
      width: 90%;
      text-align: center;
    }

    .card-header-content h3 {
      font-size: 17px;
      color: #ffeaa7;
      margin-bottom: 4px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .card-header-content p {
      font-size: 12px;
      line-height: 1.35;
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .card-qr-overlay {
      position: relative;
      z-index: 4;
      padding: 6px;
      text-align: center;
    }

    .card-qr-overlay p {
      font-size: 9px;
      color: #00d2d3;
      margin-bottom: 3px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    @keyframes realisticFireGlow {
      0% {
        border-color: #ff3838;
        box-shadow: 0 0 10px #ff4d4d, 0 0 20px #ff9f1a, inset 0 0 10px #ff3838;
      }
      33% {
        border-color: #ff9f1a;
        box-shadow: 0 0 16px #ffb142, 0 0 28px #ff5252, inset 0 0 14px #ff9f1a;
      }
      66% {
        border-color: #ff5252;
        box-shadow: 0 0 20px #ff3838, 0 0 35px #ffb142, inset 0 0 16px #ff5252;
      }
      100% {
        border-color: #ff3838;
        box-shadow: 0 0 10px #ff4d4d, 0 0 20px #ff9f1a, inset 0 0 10px #ff3838;
      }
    }

    .qr-img-wrapper {
      width: 100%;
      max-width: 95px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ff3838;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      animation: realisticFireGlow 2.2s infinite ease-in-out;
      z-index: 5;
      position: relative;
    }

    .qr-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .emoji-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }

    .floating-emoji {
      position: absolute;
      bottom: -20px;
      animation: floatUpEmoji 3.5s linear infinite;
      opacity: 0.9;
      user-select: none;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    @keyframes floatUpEmoji {
      0% { transform: translateY(0px) scale(0.7) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-380px) scale(1.3) rotate(360deg); opacity: 0; }
    }

    /* Minimal Animated Music Player */
    .custom-music-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 17, 36, 0.9);
      border: 1.5px solid var(--accent);
      border-radius: 16px;
      padding: 5px 12px !important;
      max-height: 52px !important;
      margin-bottom: 12px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .spinning-disc {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0055, #00f2fe, #ff0055);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinDisc 3s linear infinite;
      box-shadow: 0 0 8px var(--accent-glow);
      flex-shrink: 0;
    }

    .spinning-disc-inner {
      width: 12px;
      height: 12px;
      background: #05030f;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anime-dancer-free {
      width: 44px !important;
      height: 44px !important;
      border-radius: 50%;
      border: none !important;
      overflow: hidden !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 10px var(--accent-glow);
      flex-shrink: 0;
      margin: 0 8px;
    }

    .anime-dancer-free img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      border-radius: 50%;
    }

    .equalizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
      animation: eqBounce 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 6px var(--accent);
    }

    .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 8px; }
    .eq-bar:nth-child(2) { animation-delay: 0.4s; height: 15px; }
    .eq-bar:nth-child(3) { animation-delay: 0.2s; height: 11px; }
    .eq-bar:nth-child(4) { animation-delay: 0.5s; height: 16px; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    .custom-preview-player {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 10px 16px;
      box-shadow: none !important;
      height: 48px;
    }

    .preview-eq-bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 20px;
    }

    .preview-eq-bars.playing .p-bar {
      animation: eqBounce 1.2s ease-in-out infinite alternate;
    }

    .p-bar {
      width: 4px;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
      box-shadow: 0 0 6px var(--accent);
      transition: height 0.3s ease;
    }

    .preview-eq-bars.playing .p-bar:nth-child(1) { animation-delay: 0.1s; }
    .preview-eq-bars.playing .p-bar:nth-child(2) { animation-delay: 0.4s; }
    .preview-eq-bars.playing .p-bar:nth-child(3) { animation-delay: 0.2s; }
    .preview-eq-bars.playing .p-bar:nth-child(4) { animation-delay: 0.5s; }
    .preview-eq-bars.playing .p-bar:nth-child(5) { animation-delay: 0.3s; }

    .save-btn { background: linear-gradient(135deg, #2ed573, #26af5f); box-shadow: 0 4px 10px rgba(46, 213, 115, 0.25); }
    .share-btn { background: linear-gradient(135deg, #3742fa, #2f3542); box-shadow: 0 4px 10px rgba(55, 66, 250, 0.25); }

    /* Share Modal */
    #shareModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.88);
      backdrop-filter: blur(8px);
      z-index: 995;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #111326;
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 310px;
      text-align: center;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Intro Splash Screen -->
  <div id="introSplash">
    <div class="intro-box">
      <div class="blue-white-spinner"></div>
      <div id="introMsg" style="font-size: 13px; font-weight: 700; color: var(--accent); margin: 0; text-shadow: 0 0 6px var(--accent-glow);"></div>
    </div>
  </div>

  <!-- Ocean Waves Background -->
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <!-- Language Switcher -->
  <div class="top-lang-switcher">
    <select id="userLang" onchange="changeLanguage(this.value)">
      <option value="my" selected>🇲🇲 မြန်မာ</option>
      <option value="en">🇬🇧 English</option>
    </select>
  </div>

  <div id="stepLoader">
    <div class="blue-white-spinner"></div>
    <p id="lbl_loaderMsg" style="margin-top: 12px; color: var(--accent); font-weight: 700; font-size: 13px; text-shadow: 0 0 6px var(--accent-glow);"></p>
  </div>

  <div id="shareModal">
    <div class="modal-content">
      <h3 id="lbl_modalTitle" style="color:var(--accent); font-size: 17px; margin-bottom:8px; text-shadow: 0 0 6px var(--accent-glow);"></h3>
      <p id="lbl_modalSub" style="font-size:12px; font-weight:600; margin-bottom:14px; color:#cbd5e1;"></p>
      <button class="btn share-btn" id="btn_copyLink" style="margin-bottom: 8px; font-size: 13px; padding: 10px;" onclick="copyShareLink()"></button>
      <button class="btn save-btn" id="btn_dlQrModal" style="margin-bottom: 8px; font-size: 13px; padding: 10px;" onclick="downloadSingleQrFromModal()"></button>
      <button class="btn btn-secondary" id="btn_closeModal" style="font-size: 13px; padding: 10px;" onclick="closeShareModal()"></button>
    </div>
  </div>

  <div class="app-card">

    <!-- STEP 1: LOGIN / SIGNUP -->
    <div class="step active" id="step1">
      <h2 id="lbl_authTitle"></h2>
      
      <div class="form-group">
        <label id="lbl_modeSelect"></label>
        <div class="custom-select-wrapper" id="authModeCustomSelect">
          <div class="custom-select-trigger" onclick="toggleCustomDropdown('authModeCustomSelect')">
            <span id="authModeTriggerText"></span>
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div class="custom-options" id="authModeCustomOptions">
            <div class="custom-option" onclick="selectAuthModeOption('login', '')" id="optLoginText"></div>
            <div class="custom-option" onclick="selectAuthModeOption('signup', '')" id="optSignupText"></div>
          </div>
        </div>
        <input type="hidden" id="authModeSelect" value="login">
      </div>

      <!-- LOGIN FORM -->
      <div id="loginFormSection">
        <div class="form-group">
          <label id="lbl_loginName"></label>
          <input type="text" id="loginName">
        </div>
        <div class="form-group">
          <label id="lbl_loginPass"></label>
          <input type="password" id="loginPass">
        </div>
        <button class="btn" id="btn_login" onclick="handleLogin()"></button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupFormSection" style="display: none;">
        <div class="form-group">
          <label id="lbl_signupName"></label>
          <input type="text" id="signupName">
        </div>
        <div class="form-group">
          <label id="lbl_signupNum"></label>
          <input type="text" id="signupNum" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="form-group">
          <label id="lbl_signupPass1"></label>
          <input type="password" id="signupPass1">
        </div>
        <div class="form-group">
          <label id="lbl_signupPass2"></label>
          <input type="password" id="signupPass2">
        </div>
        <button class="btn" id="btn_signup" onclick="handleSignup()"></button>
      </div>
    </div>

    <!-- STEP 2: PROFILE DASHBOARD -->
    <div class="step" id="step2">
      <h2 id="lbl_profileTitle"></h2>
      
      <div class="profile-container">
        <div class="profile-avatar-box" id="profileAvatarBox">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#a4b0be">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>

        <div class="profile-action-row">
          <div class="file-input-wrapper profile-small-btn">
            <span id="lbl_changeAvatar"></span>
            <input type="file" accept="image/*" onchange="updateProfileAvatar(this)">
          </div>
          <button class="profile-small-btn" id="lbl_changeNick" onclick="changeNickname()">
            <span>✏</span>
          </button>
        </div>

        <div class="profile-name" id="displayProfileName"></div>
        <div class="profile-id" id="displayProfileNum"></div>

        <div class="dashboard-actions">
          <button class="btn" id="lbl_reqPocketBtn" onclick="goToStep(3)" style="padding: 10px; font-size: 13px;"></button>
          <button class="btn btn-secondary" id="lbl_historyBtn" onclick="viewHistory()" style="padding: 10px; font-size: 13px;"></button>
        </div>
      </div>
    </div>

    <!-- 🌟 မတ်တမ်းများကြည့်ရန် သီးသန့် Step (Step 5 - History Section) -->
    <div class="step" id="step5">
      <h2 id="lbl_historyTitle">မှတ်တမ်းများ</h2>
      <div class="history-list-container" id="historyListContainer">
        <!-- Javascript ဖြင့် မှတ်တမ်း Link များနှင့် Dropdown များကို ဤနေရာတွင် ထည့်သွင်းမည် -->
      </div>
      <button class="btn btn-secondary" onclick="goToStep(2)" style="width: 100%; padding: 10px; font-size: 13px;">⬅ နောက်သို့</button>
    </div>

    <!-- STEP 3: REQUEST REASON & MESSAGE -->
    <div class="step" id="step3">
      <h2 id="lbl_step3Title"></h2>

      <div class="form-group">
        <label for="reasonDropdown" id="lbl_dropdown"></label>
        <div class="custom-select-wrapper" id="reasonCustomSelect">
          <div class="custom-select-trigger" onclick="toggleCustomDropdown('reasonCustomSelect')">
            <span id="reasonTriggerText"></span>
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div class="custom-options" id="reasonDropdown"></div>
        </div>
        <input type="hidden" id="reasonDropdownVal" value="">
      </div>

      <div class="form-group" id="customReasonGroup" style="display: none;">
        <label for="customReason" id="lbl_customReason"></label>
        <input type="text" id="customReason">
      </div>

      <div class="form-group">
        <label for="customNote" id="lbl_customNote"></label>
        <textarea id="customNote" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label id="lbl_musicLabel"></label>
        <div class="custom-select-wrapper" id="musicCustomSelect">
          <div class="custom-select-trigger" onclick="toggleCustomDropdown('musicCustomSelect')">
            <span id="musicTriggerText"></span>
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div class="custom-options" id="musicCustomOptions"></div>
        </div>
        <input type="hidden" id="musicDropdown" value="">
      </div>

      <div class="form-group" id="audioPreviewGroup" style="display: none;">
        <div class="custom-preview-player">
          <div class="preview-eq-bars">
            <div class="p-bar"></div>
            <div class="p-bar"></div>
            <div class="p-bar"></div>
            <div class="p-bar"></div>
            <div class="p-bar"></div>
          </div>
        </div>
        <audio id="audioPreviewPlayer" style="display: none;"></audio>
      </div>

      <div class="form-group">
        <label id="lbl_bgLabel"></label>
        <div class="file-input-wrapper">
          <div class="file-btn" id="bgImgLabel"></div>
          <input type="file" accept="image/*" onchange="handleBgImage(this)">
        </div>
      </div>

      <div class="form-group">
        <label id="lbl_qrLabel"></label>
        <div class="file-input-wrapper">
          <div class="file-btn" id="qrImgLabel"></div>
          <input type="file" accept="image/*" onchange="handleQrImage(this)">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="btn_backStep3" onclick="goToStep(2)" style="padding: 10px; font-size: 13px;"></button>
        <button class="btn" id="btn_genCard" onclick="generateAndSaveCard()" style="padding: 10px; font-size: 13px;"></button>
      </div>
    </div>

    <!-- STEP 4: RESULT CARD -->
    <div class="step" id="step4">
      <h2 id="lbl_step4Title"></h2>

      <div id="exportCard">
        <img id="cardBgImg" class="card-full-bg" alt="Card Background">
        <span class="sender-tag" id="outSender"></span>
        <div class="emoji-overlay" id="emojiOverlay"></div>
        <div class="card-header-content">
          <h3 id="outReason"></h3>
          <p id="outNote"></p>
        </div>
        <div class="card-qr-overlay">
          <p id="lbl_qrHint"></p>
          <div class="qr-img-wrapper" id="qrWrapper">
            <img id="cardQrImg" alt="QR">
          </div>
        </div>
      </div>

      <div class="custom-music-player" id="cardAudioGroup" style="display: none;">
        <div class="spinning-disc">
          <div class="spinning-disc-inner"></div>
        </div>
        <div class="anime-dancer-free">
          <img src="gif/anime.gif" alt="Custom GIF">
        </div>
        <div class="equalizer-bars">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
        <audio id="cardAudioPlayer" autoplay loop style="display: none;"></audio>
      </div>

      <div class="btn-group">
        <button class="btn save-btn" id="btn_saveQr" onclick="downloadSingleQr()" style="padding: 10px; font-size: 13px;"></button>
        <button class="btn share-btn" id="btn_share" onclick="openShareModal()" style="padding: 10px; font-size: 13px;"></button>
      </div>
      
      <div class="btn-group" style="margin-top: 8px;">
        <button class="btn btn-secondary" id="btn_profileReturn" onclick="goToStep(2)" style="padding: 10px; font-size: 13px;"></button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</body>
</html>
