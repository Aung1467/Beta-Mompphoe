  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

     crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #ff0055;
      --primary-hover: #ff3377;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --bg-glass: rgba(10, 12, 28, 0.96);
      --radius-custom: 26px;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Padauk', 'Poppins', sans-serif;
    }

    html {
      background: #05030f;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      background: radial-gradient(circle at center, #131238, #05030f);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      color: var(--text-color);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 0 calc(20px + env(safe-area-inset-bottom, 0px));
    }

    /* Intro Splash Screen */
    #introSplash {
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .intro-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 12, 28, 0.95);
      padding: 12px 20px;
      border-radius: 18px;
      border: 1.5px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    #introSplash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Open Gate (shared link ဖြင့်ဝင်သူအတွက် "ဖွင့်ကြည့်မယ်" စာမျက်နှာ) */
    #openGate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 998;
      background: rgba(5, 3, 15, 0.94);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #openGate.show { display: flex; }

    #openGate.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-box {
      text-align: center;
      padding: 28px 24px;
      width: 100%;
      max-width: 310px;
      background: rgba(10, 12, 28, 0.96);
      border-radius: 24px;
      border: 2px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255, 0, 85, 0.15);
      animation: gateIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .gate-envelope {
      font-size: 64px;
      margin-bottom: 8px;
      animation: gateFloat 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 14px rgba(255, 0, 85, 0.7));
    }

    .gate-title {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-glow);
      margin-bottom: 6px;
    }

    .gate-from {
      color: #ffeaa7;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      min-height: 18px;
      word-break: break-word;
    }

    .gate-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), #ff3377);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      animation: gatePulse 1.6s ease-in-out infinite;
    }

    .gate-btn:disabled { opacity: 0.6; animation: none; }

    @keyframes gateIn {
      0% { opacity: 0; transform: scale(0.85) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes gateFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes gatePulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(255, 0, 85, 0.4); }
      50% { box-shadow: 0 4px 26px rgba(255, 0, 85, 0.85); }
    }

    /* Ocean Waves Background */
    .ocean {
      height: 160px;
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .wave {
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,65 C650,170 900,10 1200,40 L1200,120 L0,120 Z" fill="rgba(0, 242, 254, 0.15)"/></svg>');
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
      animation: waveMove 10s linear infinite;
    }

    .wave:nth-of-type(2) {
      bottom: -10px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,65 C650,170 900,10 1200,40 L1200,120 L0,120 Z" fill="rgba(255, 0, 85, 0.15)"/></svg>');
      animation: waveMove 6s linear infinite, waveSwell 4s ease-in-out infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes waveSwell {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .top-controls-container {
      position: fixed;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 12px;
      align-items: center;
      width: 90%;
      max-width: 410px;
      justify-content: space-between;
    }

    .notice-btn {
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.6);
      background: rgba(10, 12, 28, 0.95);
      color: #00f2fe;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: all 0.3s ease;
    }

    .notice-btn:hover {
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .top-lang-switcher select {
      width: auto;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.6);
      background: rgba(10, 12, 28, 0.95);
      color: #fff;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    #stepLoader {
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    #stepLoader.show {
      opacity: 1;
      visibility: visible;
    }

    .blue-white-spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00f2fe;
      border-right-color: #ffffff;
      animation: spin 0.7s linear infinite;
      box-shadow: 0 0 10px var(--accent-glow);
      flex-shrink: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .app-card {
      width: 90%;
      max-width: 410px;
      max-height: 78vh;
      max-height: 78dvh;
      margin-top: calc(60px + env(safe-area-inset-top, 0px));
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-custom);
      border: 2px solid rgba(0, 242, 254, 0.6);
      box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(255, 0, 85, 0.15);
      padding: 20px 22px;
      position: relative;
      z-index: 10;
      animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .app-card::-webkit-scrollbar {
      width: 5px;
    }
    .app-card::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.4);
      border-radius: 10px;
    }

    @keyframes cardEntrance {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .step {
      display: none;
      opacity: 0;
      transform: translateY(15px);
    }

    .step.active {
      display: block;
      animation: stepFadeSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stepFadeSlideIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    h2 {
      color: var(--accent);
      text-align: center;
      font-size: 19px;
      margin-bottom: 16px;
      font-weight: 700;
      text-shadow: 0 0 8px var(--accent-glow);
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 12px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #ffffff;
      font-size: 13px;
      text-shadow: 0 0 6px rgba(0, 242, 254, 0.3);
    }

    .custom-select-wrapper {
      position: relative;
      width: 100%;
      user-select: none;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .custom-select-trigger:hover, .custom-select-wrapper.open .custom-select-trigger {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(255, 255, 255, 0.1);
    }

    .custom-select-trigger svg {
      width: 16px;
      height: 16px;
      fill: var(--accent);
      transition: transform 0.4s ease;
    }

    .custom-select-wrapper.open .custom-select-trigger svg {
      transform: rotate(180deg);
    }

    .custom-options {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
      opacity: 0;
      background: #0e1124;
      border: 1.5px solid transparent;
      border-radius: 12px;
      margin-top: 0;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      z-index: 99;
    }

    .custom-select-wrapper.open .custom-options {
      max-height: 250px;
      overflow-y: auto;
      opacity: 1;
      border-color: rgba(0, 242, 254, 0.6);
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 10px var(--accent-glow);
    }

    .custom-option {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s ease, padding-left 0.2s ease, color 0.2s ease;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover {
      background: rgba(0, 242, 254, 0.15);
      padding-left: 18px;
      color: var(--accent);
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(0, 242, 254, 0.35);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(255, 255, 255, 0.1);
    }

    select option {
      background: #0e1124;
      color: #fff;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: block;
      width: 100%;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    /* Upload progress: --p (0%-100%) ကို script.js မှ ပြောင်းပေးသည် */
    .file-btn {
      width: 100%;
      padding: 10px 14px;
      background-color: rgba(255, 255, 255, 0.06);
      background-image: linear-gradient(90deg, rgba(0, 242, 254, 0.38) var(--p, 0%), transparent var(--p, 0%));
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px;
      color: #ffffff;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-action-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 14px;
    }

    .profile-small-btn {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .profile-small-btn:hover, .file-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .profile-small-btn:hover {
      background: rgba(0, 242, 254, 0.12);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 11px 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #ff3377);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 0, 85, 0.4);
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 0, 85, 0.6);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      box-shadow: none;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Step 4 - ခလုတ် ၃ ခု တစ်တန်းထဲ၊ သေးသေးလေး */
    .btn-row-mini {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      margin-top: 10px;
    }

    .btn-mini {
      flex: 1 1 0;
      min-width: 0;
      padding: 7px 4px !important;
      font-size: 11px !important;
      line-height: 1.25;
      border-radius: 10px !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: none !important;
      text-shadow: none;
    }

    .btn-mini:hover {
      transform: none;
      filter: brightness(1.12);
    }

    .profile-container {
      text-align: center;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    .profile-avatar-box {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      margin: 0 auto 10px;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .profile-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 700;
      color: #ffeaa7;
      margin-bottom: 2px;
      text-shadow: 0 0 6px rgba(255,234,167,0.4);
    }

    .profile-id {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 14px;
    }

    .dashboard-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-list-container {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      padding-right: 4px;
    }

    /* ကတ် - 9:16 ၊ နောက်ခံအမဲရောင်မရှိ */
    #exportCard {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      margin: 0 auto 12px auto;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .card-full-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      display: none;
    }

    .sender-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      background: var(--primary);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(255, 71, 87, 0.5);
      z-index: 5;
    }

    .card-header-content {
      position: relative;
      z-index: 2;
      margin: auto;
      padding: 12px;
      width: 90%;
      text-align: center;
    }

    .card-qr-overlay {
      position: relative;
      z-index: 4;
      padding: 6px;
      text-align: center;
    }

    /* QR - Glow/Animation မရှိ */
    .qr-img-wrapper {
      width: 100%;
      max-width: 100px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.95);
      display: none;
      z-index: 5;
      position: relative;
      animation: none;
      box-shadow: none;
    }

    .qr-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .emoji-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }

    /* Player - နောက်ခံအမဲရောင် ဖယ်ရှားပြီး */
    .custom-music-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      padding: 6px 12px !important;
      max-height: 52px !important;
      margin-bottom: 4px;
      box-shadow: none;
    }

    .spinning-disc {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0055, #00f2fe, #ff0055);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinDisc 3s linear infinite;
      box-shadow: 0 0 8px var(--accent-glow);
      flex-shrink: 0;
    }

    .spinning-disc-inner {
      width: 12px;
      height: 12px;
      background: #05030f;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    @keyframes spinDisc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anime-dancer-free {
      width: 40px !important;
      height: 35px !important;
      transform: scale(1.5);
transform-origin: bottom center;
      border-radius: 0;
      border: none !important;
      overflow: visible !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      box-shadow: none;
      flex-shrink: 0;
      margin: 0 8px;
    }

    .anime-dancer-free img {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
    }

    .equalizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      flex-shrink: 0;
    }

    .eq-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
      animation: eqBounce 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 6px var(--accent);
    }

    .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 8px; }
    .eq-bar:nth-child(2) { animation-delay: 0.4s; height: 15px; }
    .eq-bar:nth-child(3) { animation-delay: 0.2s; height: 11px; }
    .eq-bar:nth-child(4) { animation-delay: 0.5s; height: 16px; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }

    /* Audio Preview Player */
    #audioPreviewGroup {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .custom-preview-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(14, 17, 36, 0.8);
      border: 1.5px solid rgba(0, 242, 254, 0.5);
      border-radius: 14px;
      padding: 6px 12px;
      box-shadow: 0 0 12px var(--accent-glow);
      position: relative;
      width: 100%;
    }

    .cd-disc-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cd-disc {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0055, #00f2fe, #ff0055);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinDisc 3s linear infinite;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .cd-center {
      width: 10px;
      height: 10px;
      background: #05030f;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    #musicCustomSelect {
      flex: 1;
      min-width: 0;
      margin: 0;
      position: relative;
    }

    #musicCustomSelect .custom-select-trigger {
      border: none !important;
      background: transparent !important;
      padding: 4px 6px !important;
      box-shadow: none !important;
    }

    #musicCustomSelect .custom-select-trigger span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    #musicCustomSelect .custom-options {
      top: 100%;
      left: 0;
      width: 100%;
      z-index: 100;
      border-radius: 12px;
      margin-top: 6px;
    }

    #musicCustomSelect.open .custom-options {
      max-height: 150px;
    }

    .preview-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      flex-shrink: 0;
    }

    .p-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
      animation: eqBounce 1.2s ease-in-out infinite alternate;
      box-shadow: 0 0 6px var(--accent);
    }

    .p-bar:nth-child(1) { animation-delay: 0.1s; height: 8px; }
    .p-bar:nth-child(2) { animation-delay: 0.4s; height: 15px; }
    .p-bar:nth-child(3) { animation-delay: 0.2s; height: 11px; }
    .p-bar:nth-child(4) { animation-delay: 0.5s; height: 16px; }
    .p-bar:nth-child(5) { animation-delay: 0.3s; height: 10px; }

    .save-btn { background: linear-gradient(135deg, #2ed573, #26af5f); box-shadow: 0 4px 10px rgba(46, 213, 115, 0.25); }
    .share-btn { background: linear-gradient(135deg, #3742fa, #2f3542); box-shadow: 0 4px 10px rgba(55, 66, 250, 0.25); }

    #shareModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.88);
      backdrop-filter: blur(8px);
      z-index: 995;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #111326;
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 310px;
      text-align: center;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    footer a:hover {
      text-decoration: underline !important;
    }
  </style>
</head>
<body>

  <!-- Intro Splash Screen -->
  <div id="introSplash">
    <div class="intro-box">
      <div class="blue-white-spinner"></div>
      <div id="introMsg" style="font-size: 13px; font-weight: 700; color: var(--accent); margin: 0; text-shadow: 0 0 6px var(--accent-glow);"></div>
    </div>
  </div>

  <!-- Open Gate: Share link ဖြင့်ဝင်လျှင် အရင်ပေါ်မည့် "ဖွင့်ကြည့်မယ်" စာမျက်နှာ -->
  <div id="openGate">
    <div class="gate-box">
      <div class="gate-envelope">🧧</div>
      <div class="gate-title" id="gateTitle"></div>
      <div class="gate-from" id="gateFrom"></div>
      <button type="button" class="gate-btn" id="gateBtn"></button>
    </div>
  </div>

  <!-- Ocean Waves Background -->
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <!-- Centered Top Controls -->
  <div class="top-controls-container">
    <button type="button" class="notice-btn" id="btn_notice" onclick="openNoticeModal()"></button>
    <div class="top-lang-switcher">
      <select id="userLang" onchange="changeLanguage(this.value)" aria-label="Language">
        <option value="my" selected>🇲🇲 မြန်မာ</option>
        <option value="en">🇬🇧 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="th">🇹🇭 ไทย</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>
  </div>

  <!-- Notice Modal -->
  <div id="noticeModal" style="display: none; position: fixed; inset: 0; background: rgba(5, 3, 15, 0.9); backdrop-filter: blur(8px); z-index: 999; justify-content: center; align-items: center; padding: 20px;">
    <div class="modal-content" style="max-width: 320px; max-height: 85vh; overflow-y: auto; text-align: left; border: 2px solid var(--accent);">
      <h3 id="lbl_noticeTitle" style="color: var(--accent); font-size: 17px; margin-bottom: 10px; text-align: center;"></h3>
      <ul id="lbl_noticeList" style="font-size: 12px; color: #cbd5e1; padding-left: 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; font-weight: 600;"></ul>
      <button type="button" class="btn" id="btn_noticeClose" onclick="closeNoticeModal()" style="width: 100%; padding: 10px; font-size: 13px;"></button>
    </div>
  </div>

  <div id="stepLoader">
    <div class="blue-white-spinner"></div>
    <p id="lbl_loaderMsg" style="margin-top: 12px; color: var(--accent); font-weight: 700; font-size: 13px; text-shadow: 0 0 6px var(--accent-glow);"></p>
  </div>

  <div id="shareModal">
    <div class="modal-content">
      <h3 id="lbl_modalTitle" style="color:var(--accent); font-size: 17px; margin-bottom:8px; text-shadow: 0 0 6px var(--accent-glow);"></h3>
      <p id="lbl_modalSub" style="font-size:12px; font-weight:600; margin-bottom:14px; color:#cbd5e1;"></p>
      <button type="button" class="btn share-btn" id="btn_copyLink" style="margin-bottom: 8px; font-size: 13px; padding: 10px; width: 100%;" onclick="copyShareLink()"></button>
      <button type="button" class="btn save-btn" id="btn_dlQrModal" style="margin-bottom: 8px; font-size: 13px; padding: 10px; width: 100%;" onclick="downloadSingleQrFromModal()"></button>
      <button type="button" class="btn btn-secondary" id="btn_closeModal" style="font-size: 13px; padding: 10px; width: 100%;" onclick="closeShareModal()"></button>
    </div>
  </div>

  <div class="app-card">

    <!-- STEP 1: LOGIN / SIGNUP -->
    <div class="step active" id="step1">
      <h2 id="lbl_authTitle"></h2>

      <div class="form-group">
        <label id="lbl_modeSelect"></label>
        <div class="custom-select-wrapper" id="authModeCustomSelect">
          <div class="custom-select-trigger" onclick="toggleCustomDropdown('authModeCustomSelect')">
            <span id="authModeTriggerText"></span>
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div class="custom-options" id="authModeCustomOptions">
            <div class="custom-option" id="optLoginText"></div>
            <div class="custom-option" id="optSignupText"></div>
          </div>
        </div>
        <input type="hidden" id="authModeSelect" value="login">
      </div>

      <div id="loginFormSection">
        <div class="form-group">
          <label for="loginName" id="lbl_loginName"></label>
          <input type="text" id="loginName" autocomplete="username" maxlength="40">
        </div>
        <div class="form-group">
          <label for="loginPass" id="lbl_loginPass"></label>
          <input type="password" id="loginPass" autocomplete="current-password">
        </div>
        <button type="button" class="btn" id="btn_login" onclick="handleLogin()" style="width: 100%;"></button>
      </div>

      <div id="signupFormSection" style="display: none;">
        <div class="form-group">
          <label for="signupName" id="lbl_signupName"></label>
          <input type="text" id="signupName" autocomplete="username" maxlength="40">
        </div>
        <div class="form-group">
          <label for="signupNum" id="lbl_signupNum"></label>
          <input type="text" id="signupNum" inputmode="numeric" maxlength="20" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="form-group">
          <label for="signupPass1" id="lbl_signupPass1"></label>
          <input type="password" id="signupPass1" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="signupPass2" id="lbl_signupPass2"></label>
          <input type="password" id="signupPass2" autocomplete="new-password">
        </div>
        <button type="button" class="btn" id="btn_signup" onclick="handleSignup()" style="width: 100%;"></button>
      </div>
    </div>

    <!-- STEP 2: PROFILE DASHBOARD -->
    <div class="step" id="step2">
      <h2 id="lbl_profileTitle"></h2>

      <div class="profile-container">
        <div class="profile-avatar-box" id="profileAvatarBox">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#a4b0be">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>

        <div class="profile-name" id="displayProfileName"></div>
        <div class="profile-id" id="displayProfileNum"></div>

        <div class="profile-action-row">
          <label class="file-input-wrapper profile-small-btn">
            <span id="lbl_changeAvatar"></span>
            <input type="file" accept="image/*" onchange="updateProfileAvatar(this)">
          </label>
          <button type="button" class="profile-small-btn" id="lbl_changeNick" onclick="changeNickname()"></button>
        </div>

        <div class="dashboard-actions">
          <button type="button" class="btn" id="lbl_reqPocketBtn" onclick="goToStep(3)" style="padding: 10px; font-size: 13px;"></button>
          <button type="button" class="btn btn-secondary" id="lbl_historyBtn" onclick="viewHistory()" style="padding: 10px; font-size: 13px;"></button>
          <button type="button" class="btn btn-secondary" id="btn_logout" onclick="handleLogout()" style="padding: 10px; font-size: 13px;"></button>
        </div>
      </div>
    </div>

    <!-- STEP 5: HISTORY SECTION -->
    <div class="step" id="step5">
      <h2 id="lbl_historyTitle"></h2>
      <div class="history-list-container" id="historyListContainer"></div>
      <button type="button" class="btn btn-secondary" id="btn_backHistory" onclick="goToStep(2)" style="width: 100%; padding: 10px; font-size: 13px;"></button>
    </div>

    <!-- STEP 3: REQUEST REASON & MESSAGE -->
    <div class="step" id="step3">
      <h2 id="lbl_step3Title"></h2>

      <div class="form-group">
        <label id="lbl_dropdown"></label>
        <div class="custom-select-wrapper" id="reasonCustomSelect">
          <div class="custom-select-trigger" onclick="toggleCustomDropdown('reasonCustomSelect')">
            <span id="reasonTriggerText"></span>
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
          <div class="custom-options" id="reasonDropdown"></div>
        </div>
        <input type="hidden" id="reasonDropdownVal" value="">
      </div>

      <div class="form-group" id="customReasonGroup" style="display: none;">
        <label for="customReason" id="lbl_customReason"></label>
        <input type="text" id="customReason" maxlength="60">
      </div>

      <div class="form-group">
        <label for="customNote" id="lbl_customNote"></label>
        <textarea id="customNote" rows="2" maxlength="200"></textarea>
      </div>

      <!-- Music player & dropdown -->
      <div class="form-group" id="audioPreviewGroup">
        <label id="lbl_musicLabel"></label>
        <div class="custom-preview-player">
          <div class="cd-disc-wrapper">
            <div class="cd-disc" id="cdDiscElement">
              <div class="cd-center"></div>
            </div>
          </div>

          <div class="custom-select-wrapper" id="musicCustomSelect">
            <div class="custom-select-trigger" onclick="toggleCustomDropdown('musicCustomSelect')">
              <span id="musicTriggerText"></span>
              <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="custom-options" id="musicCustomOptions"></div>
            <input type="hidden" id="musicDropdown" value="">
          </div>

          <div class="preview-eq-bars">
            <div class="p-bar"></div><div class="p-bar"></div><div class="p-bar"></div><div class="p-bar"></div><div class="p-bar"></div>
          </div>
        </div>
        <audio id="audioPreviewPlayer" style="display: none;"></audio>
      </div>

      <div class="form-group">
        <label id="lbl_bgLabel"></label>
        <div class="file-input-wrapper">
          <div class="file-btn" id="bgImgLabel"></div>
          <input type="file" accept="image/*,video/*" onchange="handleBgImage(this)">
        </div>
      </div>

      <div class="form-group">
        <label id="lbl_qrLabel"></label>
        <div class="file-input-wrapper">
          <div class="file-btn" id="qrImgLabel"></div>
          <input type="file" accept="image/*" onchange="handleQrImage(this)">
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="btn_backStep3" onclick="goToStep(2)" style="padding: 10px; font-size: 13px;"></button>
        <button type="button" class="btn" id="btn_genCard" onclick="generateAndSaveCard()" style="padding: 10px; font-size: 13px;"></button>
      </div>
    </div>

    <!-- STEP 4: RESULT CARD (9:16) -->
    <div class="step" id="step4">
      <h2 id="lbl_step4Title"></h2>

      <div id="exportCard">
        <img id="cardBgImg" class="card-full-bg" alt="Card Background">
        <video id="cardBgVideo" class="card-full-bg" autoplay loop muted playsinline preload="auto" style="display: none;"></video>

        <span class="sender-tag" id="outSender"></span>
        <div class="emoji-overlay" id="emojiOverlay"></div>
        <div class="card-header-content">
          <h3 id="outReason"></h3>
          <p id="outNote"></p>
        </div>
        <div class="card-qr-overlay">
          <p id="lbl_qrHint"></p>
          <div class="qr-img-wrapper" id="qrWrapper">
            <img id="cardQrImg" alt="QR">
          </div>
        </div>
      </div>

      <div class="custom-music-player" id="cardAudioGroup" style="display: none;">
        <div class="spinning-disc">
          <div class="spinning-disc-inner"></div>
        </div>
        <div class="anime-dancer-free">
          <img src="gif/anime.webp" alt="" onerror="this.parentNode.style.display='none'">
        </div>
        <div class="equalizer-bars">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
        <audio id="cardAudioPlayer" loop playsinline style="display: none;"></audio>
      </div>

      <!-- ခလုတ် ၃ ခု တစ်တန်းထဲ -->
      <div class="btn-row-mini">
        <button type="button" class="btn save-btn btn-mini" id="btn_saveQr" onclick="downloadSingleQr()"></button>
        <button type="button" class="btn share-btn btn-mini" id="btn_share" onclick="openShareModal()"></button>
        <button type="button" class="btn btn-secondary btn-mini" id="btn_profileReturn" onclick="returnToProfileOrLogin()"></button>
      </div>
    </div>

    <!-- STEP 6: ကတ် မတွေ့ / သက်တမ်းကုန် -->
    <div class="step" id="step6">
      <h2 id="lbl_step6Title"></h2>
      <p id="lbl_step6Msg" style="text-align: center; font-size: 13px; font-weight: 600; color: #cbd5e1; line-height: 1.6; margin-bottom: 16px;"></p>
      <button type="button" class="btn" id="btn_step6Home" onclick="leaveUnavailable()" style="width: 100%; padding: 10px; font-size: 13px;"></button>
    </div>

  </div>

  <!-- Footer Links -->
  <footer style="margin-top: 15px; margin-bottom: 15px; text-align: center; font-size: 11px; z-index: 100; position: relative;">
    <a href="javascript:void(0)" onclick="openLegalModal('about')" style="color: #00f2fe; margin: 0 5px; text-decoration: none;">About Us</a> |
    <a href="javascript:void(0)" onclick="openLegalModal('contact')" style="color: #00f2fe; margin: 0 5px; text-decoration: none;">Contact Us</a> |
    <a href="javascript:void(0)" onclick="openLegalModal('privacy')" style="color: #00f2fe; margin: 0 5px; text-decoration: none;">Privacy Policy</a> |
    <a href="javascript:void(0)" onclick="openLegalModal('terms')" style="color: #00f2fe; margin: 0 5px; text-decoration: none;">Terms &amp; Conditions</a>
  </footer>

  <!-- Policy Info Pop-up Modal -->
  <div id="legalModal" style="display: none; position: fixed; inset: 0; background: rgba(5, 3, 15, 0.95); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: #0e1124; padding: 20px; border-radius: 18px; width: 100%; max-width: 380px; max-height: 80vh; overflow-y: auto; border: 1.5px solid #00f2fe; color: #fff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);">
      <h3 id="legalModalTitle" style="color: #00f2fe; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;"></h3>
      <div id="legalModalBody" style="font-size: 12px; line-height: 1.6; color: #cbd5e1; text-align: left;"></div>
      <button type="button" id="legalModalClose" onclick="closeLegalModal()" class="btn btn-secondary" style="width: 100%; margin-top: 15px; padding: 8px; font-size: 12px;">Close</button>
    </div>
  </div>

  <!-- openLegalModal / closeLegalModal များကို script.js ထဲတွင်သာ သတ်မှတ်ထားသည် -->
  <script src="script.js"></script>
  <script>
    function openNoticeModal() {
      document.getElementById('noticeModal').style.display = 'flex';
    }
    function closeNoticeModal() {
      document.getElementById('noticeModal').style.display = 'none';
    }
  </script>
</body>
</html>
